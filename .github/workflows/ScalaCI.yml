name: Build

on:
  push:
    branches:
      - master
    tags: [ "*" ]
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Build
        run: sbt compile

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Check Style
        run: sbt check
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Test
        run: sbt test psiTest gradleAnalyzerTest
      - name: Verify real sbt workflows
        run: python3 tools/test-sbt-workflows.py
  
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Check Binary Compatibility
        run: sbt runPluginVerifier
  
  
  ci:
    runs-on: ubuntu-latest
    needs: [ build, lint, test, verification ]
    steps:
      - name: Aggregate outcomes
        run: echo "build succeeded"        
